name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags drive the version name.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      # Features cost kilobytes; a library costs megabytes. The budget catches the second.
      - name: APK size budget
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "APK size: $size bytes (budget: 716800)"
          if [ "$size" -gt 716800 ]; then
            echo "::error::The APK is $size bytes, over the 700 KB budget. A new dependency is the usual cause."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: couch-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
