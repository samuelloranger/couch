name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.COUCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "COUCH_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/couch.jks"
      - name: Build, test and sign
        env:
          COUCH_KEYSTORE: ${{ runner.temp }}/couch.jks
          COUCH_KEYSTORE_PASSWORD: ${{ secrets.COUCH_KEYSTORE_PASSWORD }}
          COUCH_KEY_ALIAS: ${{ secrets.COUCH_KEY_ALIAS }}
          COUCH_KEY_PASSWORD: ${{ secrets.COUCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="couch-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # couch.apk keeps one name across releases, so releases/latest/download/couch.apk always works.
          cp "$apk" couch.apk
          gh release create "$TAG" "$apk" "$apk.sha256" couch.apk --title "Couch ${TAG#v}" --generate-notes --verify-tag
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/couch.jks"

  ios:
    name: iPhone app
    needs: release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Built only when ios/ changed since the previous release, so unchanged releases don't carry a stale copy.
      - name: Check for iPhone app changes
        id: changed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$TAG" -- ios; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios/ unchanged since $prev: no iPhone build"
          fi
      - name: Build unsigned IPA
        if: steps.changed.outputs.build == 'true'
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Couch.xcodeproj -scheme Couch -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Couch.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Couch.xcarchive/Products/Applications/Couch.app" "$RUNNER_TEMP/ipa/Payload/"
      - name: Attach to the release
        if: steps.changed.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ipa="couch-ios-${TAG}-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$ipa" Payload)
          sha256sum "$ipa" > "$ipa.sha256"
          gh release upload "$TAG" "$ipa" "$ipa.sha256"
